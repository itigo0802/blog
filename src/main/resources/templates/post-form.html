<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${postId} != null ? '投稿編集 - Blog' : '新規投稿 - Blog'"></title>
</head>
<body>
<h1 th:text="${postId} != null ? '投稿編集' : '新規投稿'"></h1>

<form th:action="${postId} != null ? @{/posts/{id}/edit(id=${postId})} : @{/posts}"
      th:object="${postForm}" method="post">
    <div>
        <label for="title">タイトル</label>
        <input type="text" id="title" th:field="*{title}">
        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red;"></p>
    </div>
    <div>
        <label for="content">本文</label>
        <textarea id="content" th:field="*{content}" rows="10"></textarea>
        <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color:red;"></p>
    </div>
    <button type="submit">保存</button>
</form>
</body>
</html>
